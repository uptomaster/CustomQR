<!doctype html>
<html lang="ko">
  <head>
    <script>
      ;(function () {
        var s = localStorage.getItem('customqr-season') || 'spring'
        if (/^(spring|summer|autumn|winter)$/.test(s))
          document.documentElement.dataset.season = s
        else document.documentElement.dataset.season = 'spring'
      })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/cloud.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Plus+Jakarta+Sans:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>CustomQR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
